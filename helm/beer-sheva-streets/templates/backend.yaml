apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "beer-sheva-streets.fullname" . }}-backend
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.env.port }}
          env:
            - name: ELASTICSEARCH_URL
              value: {{ .Values.backend.env.elasticsearchUrl | quote }}
            - name: PORT
              value: {{ .Values.backend.env.port | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.env.port }}
  selector:
    app: backend
